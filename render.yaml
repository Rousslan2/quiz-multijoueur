# FoodPlug — serveur statique + API commandes.

services:
  - type: web
    name: foodplug
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      # Paiement Stripe — clé secrète à renseigner dans le dashboard Render
      # (Settings → Environment). Sans elle, la recharge wallet est désactivée.
      - key: STRIPE_SECRET_KEY
        sync: false

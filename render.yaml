# Render — Web service Node à la RACINE du dépôt (où se trouvent package.json et server.js).
#
# Si le build affiche encore : open '/opt/render/project/src/package.json' ENOENT
# → Dashboard Render → ton service → Settings → Root Directory : laisse VIDE (ou ".")
#    et non "src".

services:
  - type: web
    name: quiz-multijoueur
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"

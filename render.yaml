# MiamShop — site statique servi par Node (Express).
# Racine du dépôt : package.json et server.js ici.

services:
  - type: web
    name: miamshop
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"

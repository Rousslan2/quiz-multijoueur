<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FoodPlug — Connexion</title>
<link rel="stylesheet" href="assets/foodplug.css" />
<style>
body{ display:grid; place-items:center; min-height:100svh; background:var(--bg); }
.gate{ width:min(420px,94vw); }
.gcard{ border:1px solid var(--line-2); border-radius:24px; padding:36px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.6); }
.gbrand{ display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:28px; font-weight:900; font-size:20px; letter-spacing:-.03em; }
.gbrand .plug{ width:40px; height:40px; border-radius:11px; display:grid; place-items:center;
  background:linear-gradient(150deg,var(--gold-soft),var(--gold-deep)); color:#1a1206; font-weight:900; font-size:18px; }
.tabs{ display:flex; border:1px solid var(--line-2); border-radius:100px; padding:4px; gap:4px; margin-bottom:26px; background:rgba(255,255,255,.02); }
.tab{ flex:1; padding:10px; border-radius:100px; font-weight:600; font-size:14px; color:var(--text-3); transition:.25s; text-align:center; cursor:pointer; }
.tab.active{ background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:#1a1206; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); margin-bottom:7px; }
.field input{ width:100%; background:var(--surface-2); border:1px solid var(--line-2); border-radius:12px; padding:14px 16px;
  color:var(--text); font-size:15px; outline:none; transition:border-color .3s; box-sizing:border-box; }
.field input:focus{ border-color:var(--gold); }
.err{ color:#ff6b5e; font-size:13px; font-family:var(--mono); min-height:18px; margin-bottom:10px; text-align:center; }
.btn-full{ width:100%; justify-content:center; margin-top:4px; }
.divid{ display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--text-3); font-size:12px; }
.divid::before,.divid::after{ content:''; flex:1; height:1px; background:var(--line); }
.back{ display:block; text-align:center; margin-top:18px; font-size:13px; color:var(--text-3); }
.back a{ color:var(--gold-soft); }
</style>
</head>
<body>
<canvas id="bg3d" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none"></canvas>
<div class="grain"></div>

<div class="gate">
  <div class="gcard">
    <div class="gbrand"><div class="plug">F</div> FoodPlug</div>

    <div class="tabs">
      <div class="tab active" data-tab="login">Connexion</div>
      <div class="tab" data-tab="register">Créer un compte</div>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="lEmail" placeholder="ton@email.com" required autocomplete="email" /></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="lPw" placeholder="••••••••" required autocomplete="current-password" /></div>
      <div class="err" id="lErr"></div>
      <button type="submit" class="btn btn-gold btn-full" id="lBtn">Se connecter</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" style="display:none">
      <div class="field"><label>Prénom</label><input type="text" id="rName" placeholder="Ton prénom" required autocomplete="given-name" /></div>
      <div class="field"><label>Email</label><input type="email" id="rEmail" placeholder="ton@email.com" required autocomplete="email" /></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="rPw" placeholder="6 caractères min." required autocomplete="new-password" /></div>
      <div class="err" id="rErr"></div>
      <button type="submit" class="btn btn-gold btn-full" id="rBtn">Créer mon compte</button>
    </form>
  </div>
  <a href="/" class="back">← Retour à l'accueil</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/scene.js"></script>
<script>
(function(){
  // If already logged in, redirect
  fetch('/api/me').then(r => {
    if(r.ok) window.location.href = getNext() || '/';
  }).catch(() => {});

  function getNext() {
    const p = new URLSearchParams(location.search).get('next');
    return p && p.startsWith('/') ? p : null;
  }

  // Tab switch
  document.querySelector('.tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab'); if(!t) return;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); t.classList.add('active');
    const isLogin = t.dataset.tab === 'login';
    document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
  });

  function setLoading(btn, loading) {
    btn.disabled = loading;
    btn.textContent = loading ? '⏳ En cours…' : (btn.id === 'lBtn' ? 'Se connecter' : 'Créer mon compte');
  }

  // Login
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('lBtn'), err = document.getElementById('lErr');
    err.textContent = ''; setLoading(btn, true);
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: document.getElementById('lEmail').value, password: document.getElementById('lPw').value }) });
      const data = await r.json();
      if (!r.ok) { err.textContent = data.error || 'Erreur'; setLoading(btn, false); return; }
      window.location.href = getNext() || '/compte';
    } catch { err.textContent = 'Erreur réseau'; setLoading(btn, false); }
  });

  // Register
  document.getElementById('registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('rBtn'), err = document.getElementById('rErr');
    err.textContent = ''; setLoading(btn, true);
    try {
      const r = await fetch('/api/auth/register', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name: document.getElementById('rName').value, email: document.getElementById('rEmail').value, password: document.getElementById('rPw').value }) });
      const data = await r.json();
      if (!r.ok) { err.textContent = data.error || 'Erreur'; setLoading(btn, false); return; }
      window.location.href = getNext() || '/compte';
    } catch { err.textContent = 'Erreur réseau'; setLoading(btn, false); }
  });
})();
</script>
</body>
</html>

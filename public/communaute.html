<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FoodPlug — Communauté</title>

<link rel="stylesheet" href="assets/foodplug.css" />
<style>
.cwrap{ padding-top:118px; padding-bottom:40px; }
.chead{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:26px; }
.live-pill{ display:inline-flex; align-items:center; gap:9px; padding:8px 14px; border-radius:100px; font-family:var(--mono); font-size:12.5px; font-weight:700;
  border:1px solid rgba(57,217,138,.3); background:rgba(57,217,138,.07); color:#39d98a; }

.cgrid{ display:grid; grid-template-columns:230px 1fr 250px; gap:16px; height:min(72vh,720px); }
@media(max-width:1040px){ .cgrid{ grid-template-columns:200px 1fr; } .members{ display:none; } }
@media(max-width:720px){ .cgrid{ grid-template-columns:1fr; height:auto; } .channels{ display:none; } }

.cpanel{ border:1px solid var(--line); border-radius:20px; background:var(--surface); overflow:hidden; display:flex; flex-direction:column; }

/* channels */
.channels{ padding:16px; gap:3px; }
.ch-lbl{ font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-3); padding:10px 12px 8px; }
.ch{ display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:11px; color:var(--text-2); cursor:pointer; font-size:14.5px; font-weight:500; transition:background .25s, color .25s; }
.ch:hover{ background:rgba(255,255,255,.04); color:var(--text); }
.ch.active{ background:rgba(240,169,58,.1); color:var(--gold-soft); }
.ch .h{ opacity:.5; font-weight:700; }
.ch .badge-n{ margin-left:auto; font-family:var(--mono); font-size:10px; background:var(--kfc); color:#fff; padding:2px 7px; border-radius:100px; }

/* chat */
.chat-head{ display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line); flex:none; }
.chat-head .nm{ font-weight:700; } .chat-head .meta{ font-family:var(--mono); font-size:12px; color:var(--text-3); margin-left:auto; }
.feed{ flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:18px; scroll-behavior:smooth; }
.feed::-webkit-scrollbar{ width:8px; } .feed::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:10px; }
.cmsg{ display:flex; gap:12px; align-items:flex-start; }
.cmsg .av{ width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:13px; font-weight:700; }
.cmsg .body{ min-width:0; }
.cmsg .line1{ display:flex; align-items:baseline; gap:9px; }
.cmsg .who{ font-weight:600; font-size:14.5px; } .cmsg .when{ font-family:var(--mono); font-size:11px; color:var(--text-3); }
.cmsg .txt{ color:var(--text-2); font-size:14.5px; margin-top:3px; line-height:1.5; }
.cmsg.me .txt{ color:var(--text); }
.pin{ background:rgba(240,169,58,.07); border:1px solid rgba(240,169,58,.25); border-radius:14px; padding:12px 14px; display:flex; gap:12px; align-items:center; }
.pin .tag{ font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--gold); }
.composer{ display:flex; gap:10px; padding:14px; border-top:1px solid var(--line); flex:none; }
.composer input{ flex:1; background:var(--surface-2); border:1px solid var(--line-2); border-radius:100px; padding:13px 18px; color:var(--text); font-family:var(--font); font-size:14.5px; outline:none; transition:border-color .3s; }
.composer input:focus{ border-color:var(--gold); }
.composer .send{ width:48px; height:48px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:#1a1206; font-size:18px; transition:transform .4s var(--spring); }
.composer .send:hover{ transform:scale(1.08); }
.composer .send:active{ transform:scale(.92); }

/* members */
.members{ padding:16px; }
.mem{ display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:11px; transition:background .25s; }
.mem:hover{ background:rgba(255,255,255,.03); }
.mem .av{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; position:relative; }
.mem .av .on{ position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%; background:#39d98a; border:2px solid var(--surface); }
.mem .nm{ font-size:14px; font-weight:500; } .mem .rl{ font-size:11px; color:var(--text-3); font-family:var(--mono); }
</style>
</head>

<section class="cwrap wrap">
  <div class="chead rv">
    <div>
      <span class="kicker">La commu</span>
      <h1 class="h3" style="margin-top:12px">La communauté FoodPlug. Plans, drops et entraide.</h1>
    </div>
    <span class="live-pill"><span class="dot live"></span> EN DIRECT</span>
  </div>

  <div class="cgrid rv rv-d1">
    <!-- CHANNELS -->
    <div class="cpanel channels">
      <div class="ch-lbl">Salons</div>
      <div class="ch active" data-ch="les-bons-plans"><span class="h">#</span> les-bons-plans</div>
      <div class="ch" data-ch="drops"><span class="h">#</span> drops</div>
      <div class="ch" data-ch="entraide"><span class="h">#</span> entraide</div>
      <div class="ch-lbl">Enseignes</div>
      <div class="ch" data-ch="kfc"><span class="h">#</span> kfc</div>
      <div class="ch" data-ch="mcdo"><span class="h">#</span> mcdo</div>
      <div class="ch" data-ch="otacos"><span class="h">#</span> otacos</div>
    </div>

    <!-- CHAT -->
    <div class="cpanel">
      <div class="chat-head"><span class="h" style="color:var(--text-3);font-weight:700">#</span> <span class="nm" id="chName">les-bons-plans</span> <span class="meta" id="chMeta"></span></div>
      <div class="feed" id="feed"></div>
      <div class="composer">
        <input id="msgInput" type="text" placeholder="Écris un message à #les-bons-plans…" />
        <button class="send" id="sendBtn">↑</button>
      </div>
    </div>

    <!-- MEMBERS -->
    <div class="cpanel members">
      <div class="ch-lbl" id="memberLbl">En ligne</div>
      <div class="mem"><div class="av" style="background:var(--gold);color:#1a1206">FP<span class="on"></span></div><div><div class="nm">FoodPlug</div><div class="rl">BOT · Officiel</div></div></div>
      <div class="mem" id="myMember" style="display:none"><div class="av" id="myAv" style="background:#2a2a32;color:var(--text-2)"><span id="myAvi">?</span><span class="on"></span></div><div><div class="nm" id="myName">Vous</div><div class="rl" id="myRl">Membre</div></div></div>
    </div>
  </div>
</section>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#08080a"/><rect x="24" y="32" width="52" height="34" rx="10" fill="#f0a93a"/><text x="50" y="88" font-family="monospace" font-size="9" fill="#f0a93a" text-anchor="middle" font-weight="bold">COMMU</text></svg></template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="image-slot.js"></script>
<script src="assets/scene.js"></script>
<script src="assets/user.js"></script>
<script>
(function(){
  const feed=document.getElementById('feed'), input=document.getElementById('msgInput'), send=document.getElementById('sendBtn');
  let curCh='les-bons-plans', pollTimer=null, lastId=null, locks={};

  function applyLock(){
    const locked = !!locks[curCh];
    input.disabled = locked;
    send.disabled = locked;
    send.style.opacity = locked ? '.4' : '';
    send.style.pointerEvents = locked ? 'none' : '';
    input.placeholder = locked ? '🔒 Salon verrouillé par un administrateur' : 'Écris un message à #'+curCh+'…';
    const meta = document.getElementById('chMeta');
    if(meta) meta.textContent = locked ? '🔒 Verrouillé' : '';
  }

  async function refreshLocks(){
    try { locks = await fetch('/api/chat/status').then(r=>r.ok?r.json():{}); } catch {}
    applyLock();
  }

  // Avatar color palette
  const palette=['#e4002b','#ffc72c','#ff4133','#5b6bff','#39d98a','#a855f7','#f59e0b','#06b6d4'];
  const colorCache={};
  function colorFor(initials) {
    if(colorCache[initials]) return colorCache[initials];
    let h=0; for(const c of initials) h=(h*31+c.charCodeAt(0))%palette.length;
    colorCache[initials]=palette[h]; return colorCache[initials];
  }

  function timeAgo(d){
    const s=Math.floor((Date.now()-new Date(d))/1000);
    if(s<60) return 'à l\'instant';
    if(s<3600) return 'il y a '+(Math.floor(s/60))+' min';
    if(s<86400) return 'il y a '+(Math.floor(s/3600))+'h';
    return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  }

  function msgHTML(msg, isMe){
    const c = isMe ? 'var(--gold)' : colorFor(msg.initials||'?');
    const t = isMe ? '#1a1206' : '#fff';
    return `<div class="cmsg ${isMe?'me':''}"><div class="av" style="background:${c};color:${t}">${(msg.initials||'?').slice(0,2)}</div>
      <div class="body"><div class="line1"><span class="who">${msg.name||'Anonyme'}</span><span class="when">${timeAgo(msg.date)}</span></div><div class="txt">${msg.text}</div></div></div>`;
  }

  async function loadMessages(ch) {
    try {
      const msgs = await fetch('/api/messages/'+ch).then(r=>r.ok?r.json():[]);
      feed.innerHTML='';
      if(!msgs.length){
        feed.innerHTML='<div style="margin:auto;text-align:center;color:var(--text-3);font-family:var(--mono);font-size:13px">Aucun message pour l\'instant — lance la discussion 👋</div>';
        lastId=null; return;
      }
      const sorted = [...msgs].reverse(); // oldest first
      sorted.forEach(m => {
        const el=document.createElement('div'); el.dataset.mid=m.id;
        el.innerHTML=msgHTML(m, FP_AUTH.user && m.userId===FP_AUTH.user.id);
        feed.appendChild(el.firstElementChild||el);
      });
      feed.scrollTop=feed.scrollHeight;
      lastId = msgs[0]?.id || null;
    } catch {}
  }

  async function pollMessages() {
    refreshLocks();
    try {
      const msgs = await fetch('/api/messages/'+curCh).then(r=>r.ok?r.json():[]);
      if(!msgs.length || msgs[0]?.id === lastId) return;
      const existingIds = new Set([...feed.querySelectorAll('[data-mid]')].map(el=>el.dataset.mid));
      const newMsgs = msgs.filter(m=>!existingIds.has(m.id));
      if(!newMsgs.length){ lastId = msgs[0].id; return; }
      if(!existingIds.size) feed.innerHTML=''; // clear empty-state placeholder
      lastId = msgs[0].id;
      newMsgs.reverse().forEach(m => {
        const el = document.createElement('div');
        el.dataset.mid = m.id;
        el.innerHTML = msgHTML(m, FP_AUTH.user && m.userId===FP_AUTH.user.id);
        feed.appendChild(el.firstElementChild || el);
      });
      feed.scrollTop=feed.scrollHeight;
    } catch {}
  }

  function startPoll() {
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(pollMessages, 4000);
  }

  document.querySelector('.channels').addEventListener('click',e=>{
    const c=e.target.closest('.ch'); if(!c)return;
    document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active')); c.classList.add('active');
    curCh=c.dataset.ch;
    document.getElementById('chName').textContent=curCh;
    applyLock();
    loadMessages(curCh);
  });

  async function sendMsg(){
    const v=input.value.trim(); if(!v) return;
    if(!FP_AUTH.user){ window.location.href='/login?next=/communaute'; return; }
    if(locks[curCh]){ applyLock(); return; }
    input.value=''; input.disabled=true;
    try {
      const res = await fetch('/api/messages/'+curCh, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text:v}) });
      if(res.status===423){ locks[curCh]=true; applyLock(); return; }
      const data = await res.json();
      if(data.ok) {
        if(!feed.querySelector('[data-mid]')) feed.innerHTML=''; // clear empty-state
        const el = document.createElement('div');
        el.dataset.mid = data.msg.id;
        el.innerHTML = msgHTML(data.msg, true);
        feed.appendChild(el.firstElementChild || el);
        feed.scrollTop=feed.scrollHeight;
        lastId = data.msg.id;
      }
    } catch {}
    input.disabled = !!locks[curCh]; input.focus();
  }

  send.addEventListener('click',sendMsg);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter')sendMsg(); });

  // Init
  FP_AUTH.init().then(u => {
    if(!u) return;
    refreshLocks();
    loadMessages(curCh);
    startPoll();
    // Show current user in members panel
    const m = document.getElementById('myMember');
    if(m && u) {
      document.getElementById('myAvi').textContent = u.initials || '?';
      document.getElementById('myName').textContent = u.name || 'Vous';
      document.getElementById('myRl').textContent = 'Membre';
      m.style.display = '';
      document.getElementById('memberLbl').textContent = 'En ligne — 2';
    }
  });
})();
</script>
<script src="assets/app.js"></script>
</body>
